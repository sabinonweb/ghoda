[package]
name = "ghoda"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs" 

# In TOML [[]] means an array i.e. we can have multiple 
# binary files
[[bin]]
path = "src/main.rs"
name = "ghoda"

[dependencies]
actix-web = "4.13.0"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.1", features = ["full"] }
sqlx = { version = "0.7", features = [
  "runtime-tokio-rustls",
  "macros",
  "postgres",
  "uuid",
  "chrono",
  "migrate",
  # "offline"
], default-features = false }
config = "0.15.22"
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.23.1", features = ["v4"] }
env_logger = "0.11.10"
log = "0.4.29"
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = ["registry", "env-filter"] }
tracing-bunyan-formatter = "0.3.10"
tracing-log = "0.2.0"
once_cell = "1.21.4"
secrecy = { version = "0.10.3", features = ["serde"] }
tracing-actix-web = "0.7.21"
unicode-segmentation = "1.13.3"
claim = "0.5.0"
validator = "0.20.0"
fake = "~2.8"

[dev-dependencies]
linkify = "0.11.0"
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
serde_json = "1.0.150"
wiremock = "0.6.5"
